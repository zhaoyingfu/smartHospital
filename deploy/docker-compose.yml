version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_hospital
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../hospital-backend/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: smart-hospital-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../hospital-backend
      dockerfile: Dockerfile
    container_name: smart-hospital-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_hospital?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis

  kiosk-frontend:
    build:
      context: ../kiosk-frontend
      dockerfile: Dockerfile
    container_name: smart-hospital-kiosk
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
    container_name: smart-hospital-admin
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
